titulo: Germanística brasileira, rumo ao Rio 2030
texto: >-
  A IVG Brasil é o capítulo brasileiro da Associação Internacional de Germanística (IVG) e reúne pesquisadores, professores e estudantes de língua e literatura alemã no Brasil. Pela primeira vez em 75 anos, a IVG é presidida da América Latina, e o próximo congresso mundial acontece no Rio de Janeiro, em 2030.
