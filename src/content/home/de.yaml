titulo: Brasilianische Germanistik auf dem Weg nach Rio 2030
texto: >-
  IVG Brasil ist das brasilianische Kapitel der Internationalen Vereinigung für Germanistik (IVG) und versammelt Forschende, Lehrende und Studierende der deutschen Sprache und Literatur in Brasilien. Zum ersten Mal seit 75 Jahren wird die IVG aus Lateinamerika geleitet, und der nächste Weltkongress findet 2030 in Rio de Janeiro statt.
