titulo: Brazilian Germanistics, on the road to Rio 2030
texto: >-
  IVG Brasil is the Brazilian chapter of the International Association for Germanic Studies (IVG) and brings together researchers, teachers and students of German language and literature in Brazil. For the first time in 75 years, the IVG is led from Latin America, and the next world congress takes place in Rio de Janeiro in 2030.
